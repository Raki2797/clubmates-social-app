services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: clubmates-backend:qa
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: qa
      HOST: 127.0.0.1
      PORT: 3001
      FACE_VERIFICATION_PYTHON_BIN: /app/.venv-face/bin/python
      FACE_EMBEDDING_SCRIPT_PATH: /app/scripts/extract_embedding.py
      FACE_VERIFICATION_DEEPFACE_HOME: /app/.deepface-home
      FACE_VERIFICATION_MODEL: ArcFace
      FACE_VERIFICATION_DETECTOR: scrfd
      FACE_VERIFICATION_THRESHOLD: "0.70"
      FACE_ANTI_SPOOF_MODEL_PATH: /app/models/minifasnet_v2.onnx
      FACE_ANTI_SPOOF_THRESHOLD: ${FACE_ANTI_SPOOF_THRESHOLD:-0.0001}
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    network_mode: host
    volumes:
      - ./Backend/.deepface-home:/app/.deepface-home
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
